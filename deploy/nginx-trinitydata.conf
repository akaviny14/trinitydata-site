# trinitydata.com.br na VPS: os arquivos do ramo main de github.com/akaviny14/trinitydata-site, clonado em
# /var/www/trinitydata (passo a passo em deploy/LEIA-ME.md). Gerado a partir de ferramentas/nginx-trinitydata.conf.
# Instalar em /etc/nginx/sites-available/trinitydata.conf, ligar em sites-enabled e testar com `nginx -t`.
# Os cabeçalhos repetem os de ferramentas/vercel.producao.json (sem o noindex do teste), mais o HSTS.
# `listen ... http2` na forma antiga, que vale no Nginx do Ubuntu 22.04 (1.18) e 24.04 (1.24).
# O certificado sai do Let's Encrypt: `certbot certonly --webroot -w /var/www/certbot -d trinitydata.com.br -d www.trinitydata.com.br`.

# HTTP: só a validação do certificado; o resto vai para o HTTPS do endereço oficial (sem www).
server {
  listen 80;
  listen [::]:80;
  server_name trinitydata.com.br www.trinitydata.com.br;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://trinitydata.com.br$request_uri; }
}

# www → endereço oficial
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.trinitydata.com.br;
  ssl_certificate /etc/letsencrypt/live/trinitydata.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/trinitydata.com.br/privkey.pem;
  return 301 https://trinitydata.com.br$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name trinitydata.com.br;
  ssl_certificate /etc/letsencrypt/live/trinitydata.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/trinitydata.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /var/www/trinitydata;
  index index.html;
  server_tokens off;
  charset utf-8;

  # Nenhum add_header dentro dos location abaixo: no Nginx, um add_header no location apaga os do server.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formspree.io; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  # Só o site é servido: nada de .git, da pasta deploy/, do registro de mudanças nem da configuração da Vercel.
  location ~ /\. { deny all; }
  location ^~ /deploy/ { return 404; }
  location ~ \.(md|conf|json)$ { return 404; }

  # Endereços limpos, como o cleanUrls da Vercel: /empresa serve empresa.html, e quem pede .html é redirecionado.
  # O teste é no $request_uri, o endereço que o visitante pediu: ele não muda quando o próprio Nginx passa de "/" para
  # /index.html por dentro, e por isso não cria laço de redirecionamento.
  if ($request_uri ~ ^/index\.html(\?.*)?$) { return 301 /$1; }
  if ($request_uri ~ ^/([^?]+)\.html(\?.*)?$) { return 301 /$1$2; }
  location / { try_files $uri $uri.html $uri/ =404; }

  location /assets/ { expires 30d; }
}
